        <div
          xmlns="http://www.w3.org/1999/xhtml"
          style="display: table-cell; white-space: nowrap; text-align: center; vertical-align: middle; width: 237.9px; height: 48px;">
          <span>
            <p>This is the text in the box</p>
          </span>
