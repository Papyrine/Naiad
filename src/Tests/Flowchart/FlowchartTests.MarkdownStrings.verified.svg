        style="display: table-cell; white-space: nowrap; text-align: center; vertical-align: middle; width: 107px; height: 64.8px;">
        <span>
          <p>The <strong>cat</strong><br />in the <em>hat</em></p>
        </span>
      </div>
    </foreignObject>
    <path
      d="M335.6,43.4 L412.2,43.4 L450.5,67.4 L412.2,91.4 L335.6,91.4 L297.3,67.4 Z"
