      height="48"
      class="nodeLabel">
      <div
        xmlns="http://www.w3.org/1999/xhtml"
        style="display: table-cell; white-space: nowrap; text-align: center; vertical-align: middle; width: 153.2px; height: 48px;">
        <span>
          <p>Plain <em>and</em> italic</p>
        </span>
      </div>
    </foreignObject>
    <path
      d="M555.5,43.4 H716.4 V91.4 H555.5 Z"
