      markerHeight="11"
      orient="auto">
      <path
        d="M 1,1 l 9,9 M 10,1 l -9,9"
        class="arrowMarkerPath"
        style="stroke-width: 2;" />
    </marker>
    <marker
      id="naiad_flowchart-crossStart"
      class="marker cross"
      viewBox="0 0 11 11"
      refX="-1"
      refY="5.2"
      markerUnits="userSpaceOnUse"
      markerWidth="11"
      markerHeight="11"
      orient="auto">
