<svg
  id="naiad"
  width="100%"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 551.6875 450"
  style="max-width: 551.6875px;"
  role="graphics-document document"
  aria-roledescription="pie">
  <style
    xmlns="http://www.w3.org/1999/xhtml">@import url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css");</style>
  <style>
#naiad{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#naiad .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}
#naiad .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}
#naiad .pieTitleText{text-anchor:middle;font-size:25px;fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;}
#naiad .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;font-size:17px;}
#naiad .legend text{fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}
</style>
  <g />
  <g
    transform="translate(225,225)">
    <circle
      cx="0"
      cy="0"
      r="186"
      class="pieOuterCircle" />
    <path
      d="M0,-185A185,185,0,1,1,0,185A185,185,0,1,1,0,-185Z"
      fill="#ECECFF"
      class="pieCircle" />
    <text
      transform="translate(0,138.75)"
      class="slice"
      style="text-anchor: middle;">100%</text>
    <text
      x="0"
      y="-200"
      class="pieTitleText">Coverage</text>
    <g
      class="legend"
      transform="translate(216,-22)">
      <rect
        width="18"
        height="18"
        style="fill: rgb(236, 236, 255); stroke: rgb(236, 236, 255);" />
      <text
        x="22"
        y="14">Covered</text>
    </g>
    <g
      class="legend"
      transform="translate(216,0)">
      <rect
        width="18"
        height="18"
        style="fill: rgb(255, 255, 222); stroke: rgb(255, 255, 222);" />
      <text
        x="22"
        y="14">Missed</text>
    </g>
  </g>
</svg>