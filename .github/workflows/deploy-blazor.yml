name: Deploy GH Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install the .NET 11 preview SDK pinned by global.json; it also builds the net10.0 Naiad library.
      # No extra runtime install is needed here — the hosted Ubuntu image already ships the .NET 10
      # (LTS) runtime, and the only project run below targets net11.0.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Optimizes the published WASM (smaller dotnet.wasm via native relinking). The app is
      # single-threaded, so this is a size optimization, not a runtime requirement — publish also
      # succeeds without it.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # GeneratePackageOnBuild=false skips packing the referenced Naiad library. The deploy never uses the
      # NuGet package, and packing runs SponsorCheck, which fails on CI (SC102) without a GitHubToken
      # secret — so disabling the pack avoids needing that credential here.
      - name: Build tests (also publishes the Blazor app for the snapshot tests)
        run: dotnet build src/Naiad.Web.Tests --configuration Release -p:GeneratePackageOnBuild=false

      # TUnit ships as an executable on Microsoft.Testing.Platform; run it directly rather than via
      # `dotnet test`, which rejects it under the VSTest path.
      - name: Run tests
        run: dotnet src/Naiad.Web.Tests/bin/Release/net11.0/Naiad.Web.Tests.dll

      - name: Publish
        run: dotnet publish src/Naiad.Web --configuration Release --output publish -p:GeneratePackageOnBuild=false

      # The site is served from the root of the custom domain (naiad.papyrine.org), so the
      # published <base href="/" /> is already correct — no rewrite needed. (When this was a
      # GitHub project page at papyrine.github.io/Naiad/ the base had to be rewritten to /Naiad/.)

      - name: Add .nojekyll file
        run: touch publish/wwwroot/.nojekyll

      - name: Copy index.html to 404.html for SPA routing
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
